<!DOCTYPE html>
<html>
<head>
    <title>Diamond Price Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>💎 Diamond Price Prediction</h1>

    <form action="/predict" method="POST">
        <div class="form-group">
            <label>Carat (0.2 - 3.5):</label>
            <input type="number" name="carat" step="0.01" min="0.2" max="3.5" required>
        </div>

        <div class="form-group">
            <label>Cut:</label>
            <select name="cut" required>
                <option value="Fair">Fair</option>
                <option value="Good">Good</option>
                <option value="Very Good">Very Good</option>
                <option value="Premium">Premium</option>
                <option value="Ideal">Ideal</option>
            </select>
        </div>

        <div class="form-group">
            <label>Color:</label>
            <select name="color" required>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
                <option value="I">I</option>
                <option value="J">J</option>
            </select>
        </div>

        <div class="form-group">
            <label>Clarity:</label>
            <select name="clarity" required>
                <option value="I1">I1</option>
                <option value="SI2">SI2</option>
                <option value="SI1">SI1</option>
                <option value="VS2">VS2</option>
                <option value="VS1">VS1</option>
                <option value="VVS2">VVS2</option>
                <option value="VVS1">VVS1</option>
                <option value="IF">IF</option>
            </select>
        </div>

        <div class="form-group">
            <label>Depth (43 - 79):</label>
            <input type="number" name="depth" step="0.1" required>
        </div>

        <div class="form-group">
            <label>Table (43 - 95):</label>
            <input type="number" name="table" step="0.1" required>
        </div>

        <div class="form-group">
            <label>X dimension:</label>
            <input type="number" name="x" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Y dimension:</label>
            <input type="number" name="y" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Z dimension:</label>
            <input type="number" name="z" step="0.01" required>
        </div>

        <button type="submit">Predict Price 💎</button>
    </form>
</body>
</html>
